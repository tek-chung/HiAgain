<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My QR · Hi Again</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
         background: light-dark(#fafbf9, #1b201d); color: light-dark(#233c30, #e6f0e8); text-align: center; padding: 1.5rem 1rem; }
  .qr { background: light-dark(#fff, #e7eee8); border-radius: 18px; padding: 14px; width: min(300px, 82vw); margin: 1rem auto; }
  .qr svg { display: block; width: 100%; height: auto; }
  .muted { color: light-dark(#5d6d63, #b3c2b7); font-size: .9rem; }
  button { min-height: 44px; padding: .5rem 1rem; border-radius: 12px; border: 1px solid light-dark(#e0e7e1, #425047);
           background: light-dark(#fff, #252c27); color: inherit; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main id="app">
  <h1 style="font-size:1.4rem;margin:.5rem 0">You're offline</h1>
  <p class="muted">Open My QR once while you have signal and it will show here next time.</p>
</main>
<script>
  // Shows the QR saved by My QR on this device. The QR only encodes the public profile address.
  try {
    var d = JSON.parse(localStorage.getItem("hiagain:my-qr") || "null");
    if (d && typeof d.svg === "string" && d.svg.indexOf("<svg") === 0 && typeof d.url === "string") {
      var app = document.getElementById("app");
      app.innerHTML = "";
      var h = document.createElement("h1"); h.style.fontSize = "1.4rem"; h.style.margin = ".5rem 0";
      h.textContent = d.name || "My QR";
      var box = document.createElement("div"); box.className = "qr"; box.setAttribute("role", "img");
      box.setAttribute("aria-label", "QR code for " + d.url);
      // The SVG was generated by the app's own QR encoder; strip anything script-like regardless.
      var doc = new DOMParser().parseFromString(d.svg, "image/svg+xml");
      doc.querySelectorAll("script, foreignObject").forEach(function (n) { n.remove(); });
      var svg = doc.documentElement;
      Array.prototype.forEach.call(doc.querySelectorAll("*"), function (n) {
        Array.prototype.slice.call(n.attributes).forEach(function (a) { if (/^on/i.test(a.name)) n.removeAttribute(a.name); });
      });
      box.appendChild(document.importNode(svg, true));
      var p = document.createElement("p"); p.textContent = "Let people scan this to save you"; p.style.fontWeight = "600";
      var u = document.createElement("p"); u.className = "muted"; u.textContent = d.url; u.style.wordBreak = "break-all";
      var note = document.createElement("p"); note.className = "muted";
      note.textContent = "You're offline. People who scan this will open your profile on their own connection.";
      var b = document.createElement("button"); b.textContent = "Try again"; b.onclick = function () { location.reload(); };
      app.append(h, box, p, u, note, b);
    }
  } catch (e) { /* keep the plain offline message */ }
</script>
</body>
</html>
