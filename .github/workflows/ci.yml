# Runs the Hi Again checks on every push and pull request.
# Everything uses fictional data and a throwaway Postgres; no real credentials are needed.
name: app checks

on:
  push:
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]

defaults:
  run:
    working-directory: app

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database access-control tests
        run: npm run test:db
      - name: Production build (development-fixture mode)
        run: npm run build
      - name: Guest browser journey
        run: |
          npx playwright install --with-deps chromium
          (npm run start -- -p 3000 &)
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3000 npm run check:browser
      - name: Signed-in, Calendar, Activity, Again, scans and photo journeys
        run: npm run check:signed-in
